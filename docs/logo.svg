<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
 <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#21154a"/><stop offset="1" stop-color="#07050f"/></linearGradient>
  <radialGradient id="glow" cx="560" cy="600" r="380" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff4f9a" stop-opacity=".55"/><stop offset="1" stop-color="#ff4f9a" stop-opacity="0"/></radialGradient>
  <linearGradient id="stem" x1="0" y1="230" x2="0" y2="640" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8f6dff"/><stop offset="1" stop-color="#e64fb4"/></linearGradient>
  <linearGradient id="ring" x1="380" y1="420" x2="740" y2="780" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff4f9a"/><stop offset=".6" stop-color="#ff8a4c"/><stop offset="1" stop-color="#ffc247"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".5"/></filter>
  <filter id="cast" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#14051f" flood-opacity=".6"/></filter>
  <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
 </defs>
 <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#sh)"/>
 <g clip-path="url(#sq)">
  <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
  <!-- bowl, back half -->
  <circle cx="570" cy="600" r="168" fill="none" stroke="url(#ring)" stroke-width="116"/>
  <!-- stem over the bowl at the top -->
  <rect x="344" y="178" width="116" height="480" rx="58" fill="url(#stem)" filter="url(#cast)"/>
  <!-- bowl passes over the stem at the bottom: the bend -->
  <clipPath id="weave"><rect x="330" y="600" width="140" height="240"/></clipPath>
  <circle cx="570" cy="600" r="168" fill="none" stroke="url(#ring)" stroke-width="116" clip-path="url(#weave)"/>
  <rect x="100" y="100" width="824" height="412" fill="url(#shine)"/>
 </g>
 <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
</svg>
