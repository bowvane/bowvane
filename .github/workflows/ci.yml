name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Sans limite, une étape bloquée tourne jusqu’aux 6 h par défaut de GitHub.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Electron n’a besoin que des bibliothèques système de Chromium.
      - run: npx playwright install-deps chromium
      - run: xvfb-run -a npx playwright test
