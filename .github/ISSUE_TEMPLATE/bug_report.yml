name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got. Screenshots help.
    validations:
      required: true
  - type: input
    attributes:
      label: Courbe version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    attributes:
      label: macOS version and chip
      placeholder: "macOS 26.1, Apple M3"
  - type: textarea
    attributes:
      label: Arc import details (if relevant)
      description: Counts only (Spaces, pinned tabs, folders). Never attach your real StorableSidebar.json — it contains your URLs.
